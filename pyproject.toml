[build-system]
requires = ["setuptools>=77"]  # SPDX license field
build-backend = "setuptools.build_meta"

[project]
name = "office-planner"
version = "0.1.1"
description = "Plan office / home-office days (Bulgarian holidays) and export them to Apple Calendar."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Chavdar Shishkov" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/chavdar12/home-office-planner"

[project.scripts]
office-planner = "office_planner.cli:main"

[project.gui-scripts]
office-planner-gui = "office_planner.gui.app:main"

[tool.setuptools.packages.find]
include = ["office_planner*"]

[tool.setuptools.package-data]
"office_planner.gui" = ["icon.png"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "N", "S", "A", "PIE", "RET",
    "ARG", "PTH", "ERA", "TRY", "ISC", "Q", "BLE", "FBT", "DTZ", "T20", "PERF", "FURB",
]
ignore = [
    "DTZ007", "DTZ011",  # a local calendar: naive local dates are intended
    "FBT003",  # tkinter and unittest.mock take positional booleans
    "PERF203",  # one try per date format reads better than the alternatives
    "TRY003",  # short messages on built-in exceptions are fine
]

[tool.ruff.lint.per-file-ignores]
"office_planner/cli.py" = ["T201"]  # a CLI prints its results
"tests/*" = ["PLR2004", "S603"]  # literal expected values; tests run the CLI through sys.executable

[tool.mypy]
strict = true
python_version = "3.10"  # the oldest mypy supports; CI still runs the tests on 3.9
files = ["office_planner", "tests"]
